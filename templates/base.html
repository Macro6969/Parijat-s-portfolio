<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Parijat Majumdar — Intelligent Systems{% endblock %}</title>
  <meta name="description" content="Portfolio of Parijat Majumdar: AI/ML, computer vision, autonomous robotics and software development.">
  <meta name="theme-color" content="#0B0D10">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">

  <!-- Fonts (the CSS has system-font fallbacks if these cannot load) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Adds a "js" class so CSS only hides things for reveal animations when JavaScript works -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="top">
    <div class="container site-header__inner">
      <a class="logo" href="{{ url_for('index') }}" aria-label="Parijat, home">PARIJAT<span>.</span></a>

      <button class="nav-toggle" id="nav-toggle" type="button"
              aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <a href="{{ url_for('index') }}#top" data-section="top">Home</a>
        <a href="{{ url_for('index') }}#projects" data-section="projects">Projects</a>
        <a href="{{ url_for('index') }}#about" data-section="about">About</a>
        <a href="{{ url_for('index') }}#skills" data-section="skills">Skills</a>
        <a href="{{ url_for('index') }}#contact" data-section="contact">Contact</a>
        {% if contact is defined and contact.github %}
          <a href="{{ contact.github }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        {% else %}
          <a href="{{ site.github_repo }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="logo" href="{{ url_for('index') }}#top" aria-label="Back to top">PARIJAT<span>.</span></a>
      <span class="mono muted">{{ site.domain }}</span>
      <span class="mono muted">© {{ year }} {{ site.name }}</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
